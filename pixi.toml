[workspace]
authors = ["vinhdc10998 <v.vinhdt17@vinbigdata.org>"]
channels = ["conda-forge", "bioconda"]
name = "Spark4VCF"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
bcftools = "1.21.*"
samtools = "1.21.*"
python = "3.10.*"
openjdk = "8.*"
pandas = "1.5.3.*"
bzip2 = ">=1.0.8,<2"
xz = ">=5.8.2,<6"
libpng = ">=1.6.43,<2"
libuuid = ">=2.42,<3"
make = ">=4.4.1,<5"
gcc_linux-64 = ">=13.4.0,<14"
gxx_linux-64 = ">=13.4.0,<14"
mysql-connector-c = ">=6.1.11,<7"
unzip = ">=6.0,<7"
git = ">=2.45.1,<3"
binutils = ">=2.45.1,<3"

[feature.vep115.dependencies]
ensembl-vep = ">=115.2,<116"
perl-archive-zip = ">=1.68,<2"
perl-archive-extract = ">=0.88,<0.89"
perl-dbd-mysql = ">=4.50,<5"
perl-set-intervaltree = ">=0.12,<0.13"
perl-json = ">=4.11,<5"
perl-perlio-gzip = ">=0.20,<0.21"
perl-test-warnings = ">=0.31,<0.32"
perl-dbi = ">=1.647,<2"
perl-app-cpanminus = ">=1.7048,<2"
perl-extutils-cbuilder = ">=0.280230,<0.280231"

[feature.vep108.dependencies]
ensembl-vep = "108.*"

[environments]
default = ["vep115"]
vep108 = ["vep108"]

[pypi-dependencies]
pypgx = ">=0.26.0,<0.27"
